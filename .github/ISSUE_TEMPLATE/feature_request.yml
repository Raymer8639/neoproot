name: Feature request
description: Propose a focused improvement for supported ARM64 environments.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For setup questions, use Discussions. Do not include credentials, private rootfs files,
        or vulnerability details in a public issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the workflow, users, or environments that need this improvement.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and alternatives
      description: Describe the expected behavior and the alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and performance impact
      description: Describe expected effects on supported ARM64 environments, compatibility, and performance.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Target environment
      description: ARM64 Linux or native Termux version/device, if applicable.
      placeholder: Termux on Android 16 / aarch64
    validations:
      required: true
  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: I can test this change on a supported ARM64 Linux or native Termux environment.
          required: true
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: I removed secrets, personal data, private paths, and private rootfs material.
          required: true
        - label: This is not a security vulnerability report.
          required: true
