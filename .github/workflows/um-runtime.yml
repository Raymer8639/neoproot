# Build the UML runtime and attach it to the release.
#
# neoproot is a supervisor: it execs a kernel, and --net runs umnet + passt.
# None of those are built here -- the kernel, stub_exe, umnet and passt-bionic
# all come from linux-um-arm64 (passt from passt-android) -- so without this job
# "curl | sh" installs a neoproot that cannot boot a guest or reach the network,
# and the user has to build a kernel before anything works.
#
# Kept as its own workflow on purpose.  It builds someone else's tree with a
# pinned ref, so a change over there must not be able to fail a neoproot
# release: if this job breaks, the binaries are still published and the
# installer falls back to asking for the four files by path.
name: um runtime

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      um_ref:
        description: linux-um-arm64 ref to build
        required: false
        default: um-arm64

permissions:
  contents: write

env:
  # Bump both together; a kernel is only supported with the um-init, umnet and
  # passt of the same tree.
  UM_REPO: Raymer8639/linux-um-arm64
  UM_REF: ${{ github.event.inputs.um_ref || 'um-arm64' }}
  # The download URL uses the short form (r29), not the full revision.
  NDK_RELEASE: r29

jobs:
  runtime:
    # x86_64 on purpose: the harness looks for the NDK under
    # toolchains/llvm/prebuilt/linux-x86_64, which does not exist on an arm64
    # host.  The kernel is cross-compiled either way -- the NDK's clang targets
    # aarch64-linux-android -- so the runner's own architecture does not matter.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out linux-um-arm64
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UM_REPO }}
          ref: ${{ env.UM_REF }}
          path: um

      - name: Install the Android NDK
        run: |
          set -eu
          url="https://dl.google.com/android/repository/android-ndk-${NDK_RELEASE}-linux.zip"
          echo "downloading $url"
          curl -fsSL -o /tmp/ndk.zip "$url"
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_RELEASE}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-${NDK_RELEASE}" >> "$GITHUB_ENV"
          ls -d /opt/android-ndk-*

      - name: Build the kernel, stub, umnet and passt
        run: |
          set -eu
          cd um
          ls tools/um-arm64/harness/
          # The harness is the supported entry point; it builds with the NDK
          # above and leaves its output in the tree.
          # The harness uses "set -o pipefail", which dash (sh on Ubuntu)
          # does not support, so run it with bash explicitly.
          bash tools/um-arm64/harness/build-bionic.sh

      - name: Collect the runtime
        run: |
          set -eu
          mkdir -p dist
          # The harness writes into <tree>/../artifacts (ART defaults to that),
          # so search from the repository root rather than from the tree.
          # The release asset names are what neoproot looks for.  The harness is
          # not consistent about suffixes (the kernel is plain linux-bionic, the
          # stub is stub_exe_bionic), so try the suffixed name first and fall
          # back to the plain one rather than hard-coding either.
          for asset in linux-bionic stub_exe umnet passt-bionic; do
            path=
            for candidate in "${asset}_bionic" "$asset"; do
              found=$(find . -name "$candidate" -type f | head -1)
              if [ -n "$found" ]; then path=$found; break; fi
            done
            if [ -z "$path" ]; then
              echo "::error::build did not produce $asset"
              echo "--- candidates ---"
              find . -type f -name "${asset%%-*}*" | head -10
              exit 1
            fi
            cp "$path" "dist/$asset"
            chmod 755 "dist/$asset"
            echo "$asset <- $path"
          done
          ls -lh dist

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The binaries job creates the release; this one only adds files, so it
          # must not overwrite the notes the other job writes.
          append_body: false
          generate_release_notes: false

      - name: Keep the runtime as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: um-runtime
          path: dist/*
          if-no-files-found: error
