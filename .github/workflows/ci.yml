name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 本项目的构建目标是 ARMv8.2+ 的 Android/Termux 环境，
    # 因此在原生 ARM64 runner 上构建验证（代码含 arm_neon.h 与 ARM64 内联汇编，不支持交叉到 x86）。
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        mode: [release, portable]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld libtalloc-dev pkg-config upx binutils busybox-static

      - name: Verify process_vm build
        run: sh tests/test-process-vm-build.sh

      - name: Build neoproot
        run: |
          if [ "$MODE" = "release" ]; then
            # 默认 ARMv8.2 满血优化（与作者默认一致），makefile 自动选用 lld
            make -C src neoproot CC=clang CXX=clang++
          else
            # 通用构建（例如老设备可降级指令集），验证 MARCH 可覆盖性
            make -C src -B neoproot CC=clang CXX=clang++ MARCH="-march=armv8-a -mtune=generic"
          fi

      - name: Check binary
        run: |
          file src/neoproot
          ls -lh src/neoproot
          test -x src/neoproot

      - name: Build stat-shim
        run: |
          # The preload library must match the guest ABI; ubuntu-24.04-arm is
          # aarch64 glibc, which matches the reference container. Also run its
          # self-contained self-test (no proot needed).
          CC=gcc sh stat-shim/build.sh stat-shim
          file stat-shim/libstatfast.so
          stat-shim/shim_test

      - name: Upload stat-shim
        if: matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stat-shim-${{ github.sha }}
          path: stat-shim/libstatfast.so
          if-no-files-found: error

      - name: Run test suite
        run: |
          cd tests
          make -s all
          sh test-build-script.sh
          sh test-runtime-bindings.sh
          PROOT=../src/neoproot sh basic_test.sh
          PROOT=../src/neoproot sh advanced_test.sh
          PROOT=../src/neoproot sh test-security-regressions.sh
          PROOT=../src/neoproot sh test-link2symlink-dirent.sh
          PROOT=../src/neoproot sh test-link2symlink-stat-guard.sh
          PROOT=../src/neoproot sh test-link2symlink-mmap.sh
          PROOT=../src/neoproot sh test-link2symlink-git-objects.sh
          PROOT=../src/neoproot sh test-link2symlink-node-workflow.sh
          PROOT=../src/neoproot sh test-openat2.sh
          PROOT=../src/neoproot sh test-faccessat2.sh
          PROOT=../src/neoproot sh test-dirfd-fast-path.sh
          PROOT=../src/neoproot sh test-seccomp-notify-cli.sh
          PROOT=../src/neoproot sh test-seccomp-notify-pipe.sh
          PROOT=../src/neoproot sh test-bwrap-oldroot-bind.sh
          PROOT=../src/neoproot sh test-bwrap-proc-dirfd.sh
          PROOT=../src/neoproot sh test-bwrap-procfd-mount-target.sh
          PROOT=../src/neoproot sh test-bwrap-resolve-in-root.sh
          PROOT=../src/neoproot sh test-tracer-guard.sh
          PROOT=../src/neoproot sh test-8d3c07f5.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoproot-${{ matrix.mode }}-${{ github.sha }}
          path: src/neoproot
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      # install.sh is shipped as a release asset, so the job needs the repository
      # as well as the built artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 注意：不能用 merge-multiple——两个 artifact 的文件内容同名（都是 neoproot），
      # 合并会互相覆盖，导致 dist 为空、Release 无资产。
      - name: Rename artifacts
        run: |
          mkdir -p dist
          for d in artifacts/neoproot-*; do
            case "$d" in
              *-release-*) cp "$d/neoproot" dist/neoproot ;;
              *-portable-*) cp "$d/neoproot" dist/neoproot-portable ;;
            esac
          done
          cp artifacts/stat-shim-*/libstatfast.so dist/libstatfast.so
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          ls -lh dist
      - name: Generate checksums
        run: (cd dist && sha256sum neoproot neoproot-portable libstatfast.so > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # Put the install one-liner above the generated notes, so the release page
      # answers "how do I install this" before it lists the merged PRs. Runs
      # after the release exists, hence the PATCH.
      - name: Prepend install instructions to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .body)
          header=$(cat <<'HEADER'
          ## Install (one command)

          ```sh
          curl -fsSL https://github.com/__REPO__/releases/latest/download/install.sh | sh
          ```

          The installer builds from this tag on Termux (bionic) and downloads the
          matching binary elsewhere. These assets are **ARM64 glibc** builds for
          containers and ARM64 Linux hosts: do not install `neoproot` from here as
          the Termux `$PREFIX/bin/neoproot`. On Termux use the installer or
          `sh build.sh install` from the source tarball.

          ---

          HEADER
          )
          header=${header//__REPO__/$GITHUB_REPOSITORY}
          # Command substitution strips trailing newlines, so add the separator
          # explicitly instead of relying on the blank lines in the heredoc.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            -f body="$(printf '%s\n\n%s' "$header" "$body")" >/dev/null
          echo "release notes updated for $tag"
